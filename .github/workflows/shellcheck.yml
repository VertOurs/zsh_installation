name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe bash
        run: |
          for f in *.sh; do
            bash -n "$f"
          done
      - name: Lancer shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          check_together: 'yes'
